options:
  openstack-origin:
    default: yoga
  bgp-router-id-mappings:
    type: string
    default: ''
    description: |
      Space-separated mapping of unit number to BGP router ID, e.g.
      "0:10.0.0.1 1:10.0.0.2". Each value must be a 4-octet, unsigned,
      non-zero integer that is unique within the Autonomous System.
      When set, every unit must have an entry; a unit with no entry is
      blocked. When unset, units default to the IP on the provider network.
  bgp-router-id-fallback:
    type: string
    default: provider
    description: |
      How a unit without an entry in bgp-router-id-mappings chooses its BGP
      router ID. Valid values are 'provider' (the IP on the provider
      network) and 'highest' (the highest IPv4 address of any non-loopback
      interface on the unit).
